spring.application.name=listing-search-api
server.port=8080

# Default database: embedded H2 in Oracle mode (nothing to install).
# For your own Oracle, run with the "oracle" profile (Part 8).
spring.datasource.url=jdbc:h2:mem:listings;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only validates it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Files loaded at startup (idempotent: only missing rows are inserted)
listings.data-files=classpath:data/sample_listings.json

# Development convenience
spring.h2.console.enabled=true